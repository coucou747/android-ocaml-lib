plugins { id 'com.android.application' }
def config = rootProject.ext.androidConfig
android {
    namespace "${config.getProperty('androidNamespace')}.test"
    ndkVersion config.getProperty('ndkVersion')
    compileSdk config.getProperty('compileSdk').toInteger()
    buildToolsVersion config.getProperty('buildToolsVersion')
    defaultConfig {
        applicationId "${config.getProperty('androidNamespace')}.test"
        minSdk config.getProperty('minSdk').toInteger()
        // Required from the caller; production applications choose their own target.
        targetSdk providers.gradleProperty('testTargetSdk').get().toInteger()
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.toVersion(config.getProperty('jdkVersion')); targetCompatibility JavaVersion.toVersion(config.getProperty('jdkVersion')) }
    packaging { jniLibs { keepDebugSymbols += ['**/libintegration.so'] } }
    sourceSets.main.jniLibs.srcDirs = [new File(rootDir, '../_build/test-jni')]
}
dependencies {
    implementation "com.google.android.gms:play-services-code-scanner:${config.getProperty('codeScannerVersion')}"
    implementation "androidx.constraintlayout:constraintlayout:${config.getProperty('constraintLayoutVersion')}"
    implementation "com.google.android.material:material:${config.getProperty('materialVersion')}"
    implementation "androidx.credentials:credentials:${config.getProperty('credentialsVersion')}"
    implementation "androidx.preference:preference:${config.getProperty('preferenceVersion')}"
    implementation project(':library')
    // The instrumented codec checks construct SDK records directly.
    implementation "androidx.health.connect:connect-client:${config.getProperty('healthConnectVersion')}"
}
